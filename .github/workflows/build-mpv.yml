name: Build mpv
defaults:
  run:
    shell: bash

on:
  workflow_dispatch:
    inputs:
      github_release:
        description: 'Upload to Github release'
        required: false
        default: true
        type: boolean

permissions:
  contents: write
  actions: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  build_mpv:
    name: Build mpv (${{ matrix.llvm_arch }})
    runs-on: ubuntu-latest
    outputs:
      cache_date: ${{ steps.cache_date.outputs.value }}
      clang_version: ${{ steps.source_revisions.outputs.clang_version }}
      mpv_shorthead: ${{ steps.source_revisions.outputs.mpv }}
      ffmpeg_shorthead: ${{ steps.source_revisions.outputs.ffmpeg }}
      libplacebo_shorthead: ${{ steps.source_revisions.outputs.libplacebo }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - llvm_arch: x86-64-v3
            x86_64_level: v3
            clang_flags: ""
          - llvm_arch: znver3
            x86_64_level: znver3
            clang_flags: "-mtune=znver3"
    env:
      ARCH: x86_64
      SYSROOT_LEVEL: v3
      BUILD_DIR: build_x86_64-v3
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y automake autopoint build-essential ccache clang cmake curl gettext git libc++-dev libc++1 libc++abi-dev libc++abi1 libgmp-dev libmimalloc-dev libmpc-dev libmpfr-dev libtool libtool-bin lld llvm nasm ninja-build p7zip-full pkgconf python3-jsonschema python3-mako python3-pip unzip
          pip3 install --break-system-packages meson
          curl -fsSL --retry 3 -o /tmp/glslang.tar.gz https://github.com/KhronosGroup/glslang/releases/download/main-tot/glslang-main-linux-x86_64-release.tar.gz
          sudo tar -xzf /tmp/glslang.tar.gz -C /usr/local bin/glslang bin/glslangValidator
          glslangValidator --version

      - name: Configure git
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global pull.rebase true
          git config --global rebase.autoStash true
          git config --global fetch.prune true
          git config --global --add safe.directory $PWD

      - uses: actions/checkout@main
        with:
          ref: master

      - name: Set cache date
        id: cache_date
        run: echo "value=$(date -u +'%Y%m%d')" >> $GITHUB_OUTPUT

      - name: Load x86_64 toolchain cache
        id: toolchain_cache
        uses: actions/cache/restore@main
        with:
          path: |
            clang_root
          key: ${{ env.ARCH }}_toolchain-
          restore-keys: |
            ${{ env.ARCH }}_toolchain-
          fail-on-cache-miss: true

      - name: Derive toolchain id
        id: toolchain_id
        env:
          MATCHED_KEY: ${{ steps.toolchain_cache.outputs.cache-matched-key }}
        run: |
          toolchain_id="${MATCHED_KEY#${ARCH}_toolchain-}"
          echo "value=$toolchain_id" >> $GITHUB_OUTPUT
          echo "PACKAGES_KEY=packages-${{ env.ARCH }}-${{ matrix.x86_64_level }}-$toolchain_id-${{ github.run_id }}" >> $GITHUB_ENV

      - name: Load sources cache
        uses: actions/cache/restore@main
        with:
          path: src_packages
          key: sources

      - name: Load x86_64-v3 sysroot cache
        id: sysroot_cache
        uses: actions/cache/restore@main
        with:
          path: |
            ${{ env.BUILD_DIR }}
          key: ${{ env.ARCH }}-${{ env.SYSROOT_LEVEL }}_sysroot-${{ steps.toolchain_id.outputs.value }}
          fail-on-cache-miss: true

      - name: Load ${{ matrix.x86_64_level }} packages cache
        id: packages_cache
        uses: actions/cache/restore@main
        with:
          path: |
            ${{ env.BUILD_DIR }}
          key: ${{ env.PACKAGES_KEY }}
          restore-keys: |
            packages-${{ env.ARCH }}-${{ matrix.x86_64_level }}-${{ steps.toolchain_id.outputs.value }}

      - name: Configure CMake and download sources
        run: |
          cmake -DTARGET_ARCH=$ARCH-w64-mingw32 -DCOMPILER_TOOLCHAIN=clang -DLLVM_ARCH=${{ matrix.llvm_arch }} -DCMAKE_INSTALL_PREFIX=$PWD/clang_root -DMINGW_INSTALL_PREFIX=$PWD/$BUILD_DIR/$ARCH-${{ env.SYSROOT_LEVEL }}-w64-mingw32 -DSINGLE_SOURCE_LOCATION=$PWD/src_packages -DRUSTUP_LOCATION=$PWD/clang_root/install_rustup -DENABLE_CCACHE=ON -DCLANG_PACKAGES_LTO=ON -DCLANG_FLAGS="${{ matrix.clang_flags }}" -G Ninja --fresh -B $BUILD_DIR -S $PWD
          ninja -C $BUILD_DIR download || true

      - name: Build mpv
        id: build_mpv
        run: |
          ninja -C $BUILD_DIR update
          ninja -C $BUILD_DIR mpv

      - name: Package mpv
        run: |
          shopt -s nullglob
          mkdir -p release-${{ env.ARCH }}-${{ matrix.x86_64_level }}
          ninja -C $BUILD_DIR mpv-packaging
          archives=($BUILD_DIR/mpv*.7z)
          [ ${#archives[@]} -gt 0 ] || { echo "mpv-packaging produced no archive in $BUILD_DIR" >&2; exit 1; }
          mv "${archives[@]}" release-${{ env.ARCH }}-${{ matrix.x86_64_level }}/

      - name: Record source revisions
        id: source_revisions
        run: |
          clang_version=$(./clang_root/bin/clang -dumpversion)
          mpv_hash=$(git -C src_packages/mpv rev-parse --short HEAD)
          ffmpeg_hash=$(git -C src_packages/ffmpeg rev-parse --short HEAD)
          libplacebo_hash=$(git -C src_packages/libplacebo rev-parse --short HEAD)
          echo "clang_version=$clang_version" >> $GITHUB_OUTPUT
          echo "mpv=$mpv_hash" >> $GITHUB_OUTPUT
          echo "ffmpeg=$ffmpeg_hash" >> $GITHUB_OUTPUT
          echo "libplacebo=$libplacebo_hash" >> $GITHUB_OUTPUT

      - name: Copy ffmpeg
        run: |
          7z a -m0=lzma2 -mx=9 -ms=on release-${{ env.ARCH }}-${{ matrix.x86_64_level }}/ffmpeg-$ARCH-${{ matrix.x86_64_level }}-git-${{ steps.source_revisions.outputs.ffmpeg }}.7z ./$BUILD_DIR/$ARCH-${{ env.SYSROOT_LEVEL }}-w64-mingw32/bin/ffmpeg.exe

      - name: Collect logs
        if: always()
        env:
          LOGS_DIR: mpv-${{ env.ARCH }}-${{ matrix.x86_64_level }}-logs
        run: |
          mkdir -p "$LOGS_DIR"
          find "$BUILD_DIR" -type f \( -iname "*-*.log" -o -wholename "*/ffbuild/config.log" \) \
            -exec cp -f -t "$LOGS_DIR" {} + || true

      - name: Upload logs
        uses: actions/upload-artifact@master
        if: always()
        with:
          name: mpv-${{ env.ARCH }}-${{ matrix.x86_64_level }}-logs
          path: mpv-${{ env.ARCH }}-${{ matrix.x86_64_level }}-logs
          if-no-files-found: ignore
          retention-days: 1

      - name: Upload ${{ matrix.x86_64_level }} build
        uses: actions/upload-artifact@master
        with:
          name: mpv-${{ env.ARCH }}-${{ matrix.x86_64_level }}
          path: release-${{ env.ARCH }}-${{ matrix.x86_64_level }}/mpv-${{ env.ARCH }}*
          if-no-files-found: error
          compression-level: 0

      - name: Clean mpv build state
        if: ${{ always() && steps.build_mpv.conclusion != 'skipped' }}
        run: |
          rm -rf $BUILD_DIR/mpv*
          ninja -C $BUILD_DIR mpv-fullclean

      - name: Clean cargo cache
        if: ${{ always() && steps.build_mpv.conclusion != 'skipped' }}
        run: |
          ninja -C $BUILD_DIR cargo-clean

      - name: Delete stale sources cache
        if: ${{ always() && steps.build_mpv.conclusion != 'skipped' && matrix.x86_64_level == env.SYSROOT_LEVEL }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          gh cache delete "sources" --repo "$REPO" || true

      - name: Save sources cache
        uses: actions/cache/save@main
        if: ${{ always() && steps.build_mpv.conclusion != 'skipped' && matrix.x86_64_level == env.SYSROOT_LEVEL }}
        with:
          path: src_packages
          key: sources

      - name: Save ${{ matrix.x86_64_level }} packages cache
        uses: actions/cache/save@main
        if: ${{ always() && steps.build_mpv.conclusion != 'skipped' }}
        with:
          path: |
            ${{ env.BUILD_DIR }}
          key: ${{ env.PACKAGES_KEY }}

      - name: Delete superseded ${{ matrix.x86_64_level }} packages caches
        if: ${{ always() && steps.build_mpv.conclusion != 'skipped' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PACKAGES_PREFIX: packages-${{ env.ARCH }}-${{ matrix.x86_64_level }}-
        run: |
          gh cache list --repo "$REPO" --key "$PACKAGES_KEY" --json key --jq '.[].key' | grep -qx "$PACKAGES_KEY" || exit 0
          for key in $(gh cache list --repo "$REPO" --key "$PACKAGES_PREFIX" --json key --limit 100 --jq '.[].key'); do
            [ "$key" = "$PACKAGES_KEY" ] && continue
            gh cache delete "$key" --repo "$REPO" || true
          done

      - name: Save release cache
        uses: actions/cache/save@main
        with:
          path: release-${{ env.ARCH }}-${{ matrix.x86_64_level }}
          key: release-${{ env.ARCH }}-${{ matrix.x86_64_level }}-${{ steps.cache_date.outputs.value }}-${{ github.run_id }}

  release:
    name: Upload releases
    runs-on: ubuntu-latest
    needs: build_mpv
    env:
      ARCH: x86_64
      GH_TOKEN: ${{ github.token }}
      CURL_RETRY_OPTIONS: "--connect-timeout 60 --retry 999 --retry-delay 5 --retry-all-errors"
      RELEASE_V3_KEY: release-x86_64-v3-${{ needs.build_mpv.outputs.cache_date }}-${{ github.run_id }}
      RELEASE_ZNVER3_KEY: release-x86_64-znver3-${{ needs.build_mpv.outputs.cache_date }}-${{ github.run_id }}
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y jq
          git config --global pull.rebase true
          git config --global fetch.prune true

      - uses: actions/checkout@main
        with:
          ref: master
          fetch-tags: true

      - name: Load x86_64-v3 release cache
        uses: actions/cache/restore@main
        with:
          path: release-${{ env.ARCH }}-v3
          key: ${{ env.RELEASE_V3_KEY }}

      - name: Load x86_64-znver3 release cache
        uses: actions/cache/restore@main
        with:
          path: release-${{ env.ARCH }}-znver3
          key: ${{ env.RELEASE_ZNVER3_KEY }}

      - name: Move archives
        run: |
          mkdir -p release
          mv release-${{ env.ARCH }}-*/* release || true
          du -ah release/*

      - name: Upload packages to Github release
        id: upload_packages_gh
        if: ${{ github.event.inputs.github_release == 'true' }}
        continue-on-error: true
        run: |
          tag=$(date "+%Y%m%d-%H%M%S")-$(git rev-parse --short HEAD)
          name=$(date "+%Y-%m-%d %H:%M")
          body=$(cat <<END
          **LLVM/Clang**: ${{ needs.build_mpv.outputs.clang_version }}
          **mpv**: [${{ needs.build_mpv.outputs.mpv_shorthead }}](https://github.com/mpv-player/mpv/commit/${{ needs.build_mpv.outputs.mpv_shorthead }})
          **FFmpeg**: [${{ needs.build_mpv.outputs.ffmpeg_shorthead }}](https://github.com/FFmpeg/FFmpeg/commit/${{ needs.build_mpv.outputs.ffmpeg_shorthead }})
          **libplacebo**: [${{ needs.build_mpv.outputs.libplacebo_shorthead }}](https://github.com/haasn/libplacebo/commit/${{ needs.build_mpv.outputs.libplacebo_shorthead }})
          **Workflow**: [$GITHUB_RUN_ID]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)
          END
          )
          id=$(curl -H "Authorization: Bearer $GH_TOKEN" $CURL_RETRY_OPTIONS --fail-with-body -s -X POST -H "Accept: application/vnd.github.v3+json" https://api.github.com/repos/$GITHUB_REPOSITORY/releases -d @- <<END | jq -r '.id'
          {
            "tag_name": "$tag",
            "name": "$name",
            "body": "$(echo ${body//$'\n'/'\n'})"
          }
          END
          )
          for file in release/*.7z; do curl -H "Authorization: Bearer $GH_TOKEN" $CURL_RETRY_OPTIONS --fail-with-body -X POST -H "Accept: application/vnd.github.v3+json" -H "Content-Type: $(file -b --mime-type $file)" https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$id/assets?name=$(basename $file) --data-binary @$file; done

      - name: Prune tags
        continue-on-error: true
        run: |
          # Keep latest 30 tags/releases
          tag_list=($(git tag | sort -rV))
          old=("${tag_list[@]:30}")
          [ ${#old[@]} -gt 0 ] || exit 0
          for tag in "${old[@]}"; do
            id=$(curl -H "Authorization: Bearer $GH_TOKEN" $CURL_RETRY_OPTIONS -s -X GET -H "Accept: application/vnd.github.v3+json" https://api.github.com/repos/$GITHUB_REPOSITORY/releases/tags/$tag | jq -r '.id')
            curl -H "Authorization: Bearer $GH_TOKEN" $CURL_RETRY_OPTIONS -s -X DELETE -H "Accept: application/vnd.github.v3+json" https://api.github.com/repos/$GITHUB_REPOSITORY/releases/$id
          done
          git push origin --delete "${old[@]}"

      - name: Delete release caches
        if: ${{ github.event.inputs.github_release == 'false' || steps.upload_packages_gh.outcome == 'success' }}
        run: |
          for key in "$RELEASE_V3_KEY" "$RELEASE_ZNVER3_KEY"; do
            curl -H "Authorization: Bearer $GH_TOKEN" $CURL_RETRY_OPTIONS -s -o /dev/null -X DELETE -H "Accept: application/vnd.github.v3+json" "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/caches?key=$key"
          done
